name: Listing request
description: Ask for your app or tool to be listed on mdzip.org as supporting MDZip (.mdz) files.
title: "Listing request: <app name>"
labels: ["listing"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding MDZip support! This issue is your public statement of what your app supports. Your listing on [mdzip.org](https://mdzip.org/works-with.html) will link to it, so please write it yourself.

        Before you post, go through the [conformance guide](https://github.com/mdzip-project/mdzip-spec/blob/main/examples/implementers.md): the checklist in section 2 and the tests in section 3. Conformance is self-assessed. Known gaps are fine; the listing will say what's supported.

        If you've already written up what your app supports, for example as a table, you can paste it into **Support details** and fill in the short fields above it.
  - type: input
    id: app
    attributes:
      label: App name
      placeholder: e.g. LoveMarkDown
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Product or download page
      description: A public page where people can get the app.
      placeholder: https://
    validations:
      required: true
  - type: input
    id: developer
    attributes:
      label: Developer name to show
      description: Your name or your company's, as you'd like it in the listing.
      placeholder: e.g. NgSense
  - type: input
    id: description
    attributes:
      label: One-sentence description
      description: What the app is, for someone who hasn't heard of it. We may edit it lightly to match the site's style.
      placeholder: e.g. A Markdown editor for Mac that keeps your writing local.
  - type: dropdown
    id: license
    attributes:
      label: Price and license
      options:
        - Free
        - Free and open source
        - Free with paid features
        - Paid
  - type: input
    id: source
    attributes:
      label: Source code (optional)
      description: If the app is open source, a link to its repository (GitHub, GitLab, Codeberg...). On GitHub, adding the `mdzip` topic to your repository helps people find apps that support MDZip.
      placeholder: https://
  - type: dropdown
    id: core
    attributes:
      label: Built with an MDZip core library? (optional)
      description: Either is fine; many apps have their own implementation. If you use a core library, please give its version in Support details. If a core library fix affects your app, we can let you know.
      # Keep in step with CORE_LIBRARIES in mdzip.org/scripts/lib/ecosystem.mjs.
      options:
        - No, our own implementation
        - "@mdzip/core-js (JavaScript)"
        - mdzip-core (Python)
        - MDZip.Core (.NET)
        - mdzip-core (Rust)
        - mdzip-core-lua (Lua)
        - Other (say which in Support details)
  - type: input
    id: app-version
    attributes:
      label: App version tested
      placeholder: e.g. 1.3.2
    validations:
      required: true
  - type: dropdown
    id: spec-version
    attributes:
      label: Specification version tested against
      # Minor versions only (1.2.x): patch releases don't change the format. Add each new
      # minor or major version at the top when it's tagged (CONTRIBUTING.md).
      options:
        - 1.2.x
        - 1.1.x
        - Other (say which in Support details)
    validations:
      required: true
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms where this support has shipped
      description: Only list platforms with a released version. Mention planned ones under Known gaps.
      options:
        - label: Windows
        - label: macOS
        - label: Linux
        - label: iOS / iPadOS
        - label: Android
        - label: Web
  - type: checkboxes
    id: roles
    attributes:
      label: Roles
      description: See section 1 of the conformance guide.
      options:
        - label: Opens `.mdz` files (consumer)
        - label: Creates new `.mdz` files (producer, creation)
        - label: Saves changes to existing `.mdz` files (producer, modification)
        - label: Shows Markdown as HTML (rendering consumer)
  - type: checkboxes
    id: optional
    attributes:
      label: Optional features
      options:
        - label: 'Project mode (`"mode": "project"`), read-only'
        - label: 'Project mode, editing'
        - label: Links outside the archive (`../Notes.md`)
        - label: Links into another archive (`Other.mdz/page.md`)
  - type: textarea
    id: details
    attributes:
      label: Support details
      description: 'Go through the required items in [section 2 of the conformance guide](https://github.com/mdzip-project/mdzip-spec/blob/main/examples/implementers.md#2-required-recommended-and-optional) for each role you ticked above, and say whether your app meets each one and how. A short list or table is fine, e.g. "Opens archives without manifest.json: yes".'
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How you validated it
      description: 'Which files your app wrote that you checked with [`mdz validate`](https://github.com/mdzip-project/mdzip-cli#installation), and which version of `mdz`. For example: a new document, one with images, and our sample [`keep-on-save.mdz`](https://github.com/mdzip-project/mdzip-spec/raw/main/examples/samples/keep-on-save.mdz) after you opened, edited and saved it in your app. Also list any [conformance fixtures](https://github.com/mdzip-project/mdzip-spec/blob/main/examples/implementers.md#step-3-run-the-conformance-fixtures) you ran.'
    validations:
      required: true
  - type: textarea
    id: gaps
    attributes:
      label: Known gaps
      description: Required or recommended items you don't meet yet, and planned platforms or features.
  - type: textarea
    id: other-formats
    attributes:
      label: Other `.mdz` formats
      description: If your app also reads or writes other formats that use the `.mdz` extension, how it tells them apart, and whether it offers encrypted output (which is not MDZip). See section 5 of the guide. Please also tell us what your save dialog or menu calls the MDZip option, and which format new documents use by default; your listing tells readers how to save a file other MDZip apps can open.
  - type: textarea
    id: logo
    attributes:
      label: Logo (optional)
      description: Drag in an SVG, or a PNG at least 256 px across. We use it in the banner of the news post announcing your listing.
  - type: checkboxes
    id: permissions
    attributes:
      label: Permissions (optional)
      options:
        - label: You may use this logo in the listing and in posts announcing it.
        - label: You may announce the listing on the MDZip news page.
  - type: textarea
    id: other-listings
    attributes:
      label: Where else is your app listed? (optional)
      description: >-
        Paste the link after each place your app is listed. Not on some of them yet?
        They're good places for people to find it:
        [AlternativeTo](https://alternativeto.net/),
        [Product Hunt](https://www.producthunt.com/),
        [Microsoft Store](https://apps.microsoft.com/),
        [Homebrew](https://brew.sh/),
        [WinGet](https://learn.microsoft.com/windows/package-manager/),
        [Chocolatey](https://community.chocolatey.org/),
        [Flathub](https://flathub.org/),
        [Snapcraft](https://snapcraft.io/) and
        [awesome-markdown-editors](https://github.com/mundimark/awesome-markdown-editors).
        On some, such as AlternativeTo, we can add your app to the list of apps that support MDZip.
      value: |
        AlternativeTo:
        Product Hunt:
        Mac App Store:
        Microsoft Store:
        Homebrew:
        WinGet:
        Chocolatey:
        Flathub:
        Snapcraft:
        awesome-markdown-editors:
        Other:
